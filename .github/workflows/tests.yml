name: Tests

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 6.x - PHP 7.4-8.0, testbench ^4.0
          - php: '7.4'
            laravel: '^6.0'
            testbench: '^4.0'
          - php: '8.0'
            laravel: '^6.0'
            testbench: '^4.0'
          # Laravel 7.x - PHP 7.4 only, testbench ^5.0
          # Note: PHP 8.0 excluded due to laravel/horizon version conflicts
          - php: '7.4'
            laravel: '^7.0'
            testbench: '^5.0'
          # Laravel 8.x - PHP 7.4-8.1, testbench ^6.0
          - php: '7.4'
            laravel: '^8.0'
            testbench: '^6.0'
          - php: '8.0'
            laravel: '^8.0'
            testbench: '^6.0'
          - php: '8.1'
            laravel: '^8.0'
            testbench: '^6.0'
          # Laravel 9.x - PHP 8.0-8.2, testbench ^7.0
          - php: '8.0'
            laravel: '^9.0'
            testbench: '^7.0'
          - php: '8.1'
            laravel: '^9.0'
            testbench: '^7.0'
          - php: '8.2'
            laravel: '^9.0'
            testbench: '^7.0'
          # Laravel 10.x - PHP 8.1-8.3, testbench ^8.0
          - php: '8.1'
            laravel: '^10.0'
            testbench: '^8.0'
          - php: '8.2'
            laravel: '^10.0'
            testbench: '^8.0'
          - php: '8.3'
            laravel: '^10.0'
            testbench: '^8.0'
          # Laravel 11.x - PHP 8.2+, testbench ^9.0
          - php: '8.2'
            laravel: '^11.0'
            testbench: '^9.0'
          - php: '8.3'
            laravel: '^11.0'
            testbench: '^9.0'
          - php: '8.4'
            laravel: '^11.0'
            testbench: '^9.0'
          # Laravel 12.x - PHP 8.2+, testbench ^10.0
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
          # Laravel 13.x - PHP 8.3+, testbench ^11.0
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer config audit.block-insecure false
          composer require "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
